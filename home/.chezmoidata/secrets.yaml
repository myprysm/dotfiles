# Central secret-ref map. Logical key -> where the value lives.
#
# `domain` picks the manager: personal -> Bitwarden (bw), work -> 1Password (op).
# `ref` is the repo-visible item name: kebab-case <consumer>-<artifact>, no
# domain suffix (the manager is the domain), no infrastructure identifiers.
# `field` defaults to `value` — the standardised single-value field name.
#
# This file is the single review surface for the redaction rule and the audit
# script's expected-set. Renaming a vault item = one line here.
secrets:
  rclone-conf-personal:
    domain: personal
    ref: rclone-conf
  rclone-conf-work:
    domain: work
    ref: rclone-conf
