# Per-OS omz plugin lists — template data rather than one shared list, because
# six WSL-dead plugins are live on the Mac and vice versa.
# Per-machine extras: add a `zshPluginsExtra` list to the machine-local
# chezmoi config [data] — appended by dot_zshrc.tmpl.
zsh:
  plugins:
    # Finalised on the WSL machine. Dropped as dead or superseded:
    # autoupdate (the pinned external owns updates), colorize, direnv
    # (explicit hook in rc.d), dotnet, doctl, gradle, mvn, composer, laravel,
    # rust. `bw` was never a plugin here — a bare completion file, now
    # completions.d/_bw. zsh-syntax-highlighting stays second-to-last.
    linux: [git, brew, command-not-found, docker, docker-compose, encode64,
            golang, kubectl, helm, npm, nvm, terraform, vault,
            zsh-claudecode-completion, zsh-syntax-highlighting, zsh-autosuggestions]
    # Finalised on the Mac (#13) from its 24 declared plugins. Dropped:
    # autoupdate (the pinned external owns updates), colorize (no pygmentize),
    # command-not-found (the macOS handler needs the homebrew/command-not-found
    # tap, which is not installed — inert), direnv (explicit hook in rc.d).
    # Added: terraform and vault, whose binaries are installed here but which
    # only WSL declared. `macos` was in the placeholder and is deliberately
    # absent — the machine never declared it, so shipping it would be a new
    # choice, not adoption. The seven plugins WSL dropped as dead are live here.
    darwin: [git, brew, 1password, docker, docker-compose, encode64, golang,
             kubectl, helm, npm, nvm, terraform, vault, composer, doctl, dotnet,
             gradle, mvn, laravel, zsh-claudecode-completion,
             zsh-syntax-highlighting, zsh-autosuggestions]
