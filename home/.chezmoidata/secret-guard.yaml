# The compiled command guard, published as a GitHub release asset.
#
# Source lives in cmd/secret-guard/ in this repository; .github/workflows/
# release-secret-guard.yml builds it for every platform this estate runs on and
# attaches the binaries plus SHA256SUMS to the release.
#
# WHY A RELEASE ASSET AND NOT A BUILD STEP. `go run` was measured at 55-80 ms
# warm and 2.4 s cold, which is slower than the shell hook it replaces, so a
# prebuilt binary is required. `go` sits in the opt-in `go` bundle, not in
# `core`, so "build during apply" fails on any machine that does not enable it -
# and the guard is not optional. Committing binaries to a public repository
# would ask everyone bootstrapping to trust a build they cannot see. A release
# asset with a pinned checksum is the remaining shape.
#
# WHY AN EMPTY VERSION IS SAFE. The hook keeps its own shell splitter as an
# always-available floor and consults the binary only when it is present, so a
# machine with no binary is guarded exactly as it was before this existed.
# While `version` is empty no external is declared at all, which is what keeps
# `chezmoi apply` working before the first release is cut.
#
# TO CUT A RELEASE
#   1. go test ./cmd/secret-guard/ && ./tests/test-block-secret-reads.sh
#   2. tag `secret-guard-vX.Y.Z` and push it (the workflow does the rest).
#      Tags here are signed - tag.gpgsign is on - so `git tag` refuses a tag
#      with no message and exits "no tag message?". Pass -m or -F.
#   3. copy the digests out of the release's SHA256SUMS into `sha256` below
#   4. set `version` to `vX.Y.Z`: WITH the leading v, WITHOUT the
#      `secret-guard-` prefix. The external template spells the tag as
#      `secret-guard-` followed by this value, so either mistake builds a URL
#      that 404s. Then `chezmoi apply`.
#
# Digests are pinned rather than fetched: an unpinned download is a third party
# deciding what runs inside this estate's security hook.
secretGuard:
  version: "v0.2.0"
  sha256:
    darwin-arm64: "83846af3f30cfac3adba66ca1181fe6cad267073660f92f52a854366ab5197ec"
    darwin-amd64: "ef616342d0d1f0070bb55c2d56e5d4cb6c0a6b6786d51d7b360126d0b0d2773b"
    linux-amd64: "1f4893f0ac5fb90726f2981da8eb755b1fa7c9f1944e9bfe3a88014c83c15336"
    linux-arm64: "3f8602d9451a404713f6b8aabb720a230e52a749d973a1b0aa3543f4580840d5"
