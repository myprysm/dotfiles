# Single source of truth for every package list. run_onchange_
# scripts in .chezmoiscripts/ render these lists inline, so any edit here
# re-triggers the matching installer on next apply.
#
# Formula names are tap-qualified (owner/tap/formula): bare `terraform`/`vault`
# would pull different formulae than the HashiCorp taps this estate actually
# uses. Qualification alone was once thought sufficient; see the taps list below
# for why it is not (#8).
packages:
  # Homebrew 6 refuses to load formulae from untrusted third-party taps, so a
  # tap-qualified name is not enough — each tap is tapped and trusted before
  # bundling. Trust means brew may execute that tap's formula code; keep
  # this list to vendors' own taps and review any addition.
  # ariga/tap only supplies atlas as a transitive dep, but an untrusted tap
  # makes every unrelated install print a trust warning and fail.
  taps: [hashicorp/tap, ariga/tap, fairwindsops/tap, k0sproject/tap, netbirdio/tap]
  core:
    # gitleaks is repo tooling: the written pre-commit review rule (#6) depends
    # on it and /adopt runs it as its last gate, and the estate-wide pre-commit
    # hook fails closed without it (#18).
    brews: [bat, btop, direnv, eza, gh, gitleaks, htop, jq, mcfly, nvm, ripgrep,
            starship, tmux, uv, wget, yq]
    linux:
      brews: [gcc, bind]
    darwin:
      # gnupg is declared rather than inherited, for the same reason #9 declared
      # it on Linux and more urgently: .gitconfig sets commit.gpgsign=true on
      # every OS and macOS ships no gpg at all, so a fresh Mac would reach a
      # shell that cannot commit. pinentry-mac is inert without it.
      # automake/cmake are this OS's build-essential equivalent (Linux gets
      # those from bootstrap.sh's apt line).
      brews: [automake, cmake, coreutils, gnu-sed, gnu-time, gnupg, watch, pinentry-mac]
      casks: [devtoys, keycastr, macfuse, qbit, warp, webpquicklook, xca]
  secret:
    brews: [bitwarden-cli]          # bw on every machine; op is bootstrap-installed with the work bundle
  bundles:
    ops:
      # talosctl is homebrew/core, verified — siderolabs/tap is not needed.
      brews: [kubernetes-cli, k9s, helm, helm@3, talosctl, velero,
              hashicorp/tap/terraform, hashicorp/tap/vault, hashicorp/tap/packer,
              rclone, hcloud, argocd, cilium-cli, crane, cyphernetes, doctl,
              fairwindsops/tap/pluto, operator-sdk, k0sproject/tap/k0sctl, kind,
              netbirdio/tap/netbird, mkcert, nmap, cloudflared, krew]
      # `krew` appears in the plugin list too — that is krew's own self-upgrade,
      # and it only works once krew exists. Nothing installed it on a fresh
      # machine, so every `kubectl krew install` failed and `|| true` hid it.
      krew: [cnpg, krew, linstor, oidc-login]
      # Python CLIs installed as uv tools (uv is a core brew, and ~/.local/bin
      # is on PATH unconditionally via env.d/10-path.zsh, so the shims land
      # reachable on every machine). Records, not strings: #17 proved a bare
      # name is not enough for ansible alone — without `--python` uv silently
      # resolved an interpreter too old for ansible-core 2.20+ and DOWNGRADED
      # it, and `uv tool install ansible` installs exactly one executable,
      # `ansible-community`, so `--with-executables-from` is mandatory or the
      # tool is inert.
      # `python` is set on every entry, not only where a tool constrains it:
      # uv's default interpreter comes from machine state, not the repo. It
      # was 3.11 here when #17 ran and is 3.13 on the same machine today, and
      # a fresh machine has none of the candidates yet.
      # Versions are pinned for the same reason. An unpinned uv tool is not
      # kept fresh — nothing here runs `uv tool upgrade`, so it installs once
      # at whatever resolves that day and then sits frozen until an unrelated
      # field change rebuilds the env and silently jumps it (measured).
      # ansible lands on the Mac too, which has never had it but does hold two
      # Ansible Vault password files (mac.md §3.3) — secrets with no binary.
      uvTools:
        - package: "ansible==13.5.0"     # #17's pin: a cleanup must not double as a major upgrade
          python: "3.13"
          # Libraries the modules and inventory plugins import, not deps of ansible
          # itself. `pip` is here because this env is what /etc/ansible/hosts names as
          # localhost's interpreter, and playbooks that pip-install their own
          # dependencies need one to exist: a uv tool env ships without pip, so the
          # ansible.builtin.pip module falls through to brew's python and PEP 668
          # refuses it.
          #
          # boto3 and pydo are pinned to what the work playbook's local-prepare role
          # installs, and they are declared rather than left to it because a reconverge
          # rebuilds this env from THIS list and drops whatever pip put here. An
          # inventory plugin resolves its imports before any task runs, so a role could
          # never repair that within the same invocation, and a tag-filtered run skips
          # the role entirely. digitalocean.cloud then fails as
          # `DigitalOceanReqs has no attribute 'Client'` — the collection does
          # `from pydo import Client` in a class body and swallows the ImportError, so a
          # missing library reads as a broken collection. The pins therefore live in two
          # places: if the playbook moves one, this goes stale until someone re-runs it.
          with: [kubernetes, openshift, jmespath, pip, "boto3==1.28.53", "pydo==0.3.0"]
          executablesFrom: ansible-core
        - package: "mkdocs==1.6.1"       # #5 §8 sent this to `uvx mkdocs`; declared instead, so a fresh machine has it
          python: "3.13"
      # Union of both machines, audited and deduped by URL in #13. The Mac's 36
      # entries were checked for credentials before merging: zero non-empty
      # username/password/certFile/keyFile/caFile fields, every URL public
      # https. Its 36 collapse to 32 unique URLs — four repos were registered
      # twice there under two names (argocd/argo, cnpg/cloudnative-pg,
      # prometheus/prometheus-community, velero/vmware-tanzu), and WSL carried
      # the argocd/argo pair too. One name per URL now; the more descriptive
      # name wins. The installer repoints an existing name but never deletes
      # one, so the redundant names already registered on a machine survive
      # until removed by hand (Mac cleanup: #49).
      # WSL's 14 were a strict subset of the Mac's set. URLs carry no trailing
      # slash, purely for consistency — see the installer for why that is now
      # cosmetic rather than load-bearing.
      # incubator is Helm's deprecated incubator repo — frozen upstream but
      # still serving index.yaml (HTTP 200, checked), so it is kept, not dropped.
      helmRepos:
        - {name: external-dns, url: "https://kubernetes-sigs.github.io/external-dns"}
        - {name: cilium, url: "https://helm.cilium.io"}
        - {name: jetstack, url: "https://charts.jetstack.io"}
        - {name: dex, url: "https://charts.dexidp.io"}
        - {name: argocd, url: "https://argoproj.github.io/argo-helm"}
        - {name: velero, url: "https://vmware-tanzu.github.io/helm-charts"}
        - {name: traefik, url: "https://helm.traefik.io/traefik"}
        - {name: twuni, url: "https://twuni.github.io/docker-registry.helm"}
        - {name: verdaccio, url: "https://charts.verdaccio.org"}
        - {name: emberstack, url: "https://emberstack.github.io/helm-charts"}
        - {name: cnpg, url: "https://cloudnative-pg.github.io/charts"}
        - {name: vm, url: "https://victoriametrics.github.io/helm-charts"}
        - {name: jellyfin, url: "https://jellyfin.github.io/jellyfin-helm"}
        - {name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts"}
        - {name: grafana, url: "https://grafana.github.io/helm-charts"}
        - {name: ingress-nginx, url: "https://kubernetes.github.io/ingress-nginx"}
        - {name: metrics-server, url: "https://kubernetes-sigs.github.io/metrics-server"}
        - {name: metallb, url: "https://metallb.github.io/metallb"}
        - {name: oauth2-proxy, url: "https://oauth2-proxy.github.io/manifests"}
        - {name: elastic, url: "https://helm.elastic.co"}
        - {name: signoz, url: "https://charts.signoz.io"}
        - {name: crowdsec, url: "https://crowdsecurity.github.io/helm-charts"}
        - {name: temporal, url: "https://go.temporal.io/helm-charts"}
        - {name: intel, url: "https://intel.github.io/helm-charts"}
        - {name: stakater, url: "https://stakater.github.io/stakater-charts"}
        - {name: open-webui, url: "https://open-webui.github.io/helm-charts"}
        - {name: hcloud, url: "https://charts.hetzner.cloud"}
        - {name: guerzon, url: "https://guerzon.github.io/vaultwarden"}
        - {name: piraeus-charts, url: "https://piraeus.io/helm-charts"}
        - {name: hwameistor-operator, url: "https://hwameistor.io/hwameistor-operator"}
        - {name: hwameistor-drbd-adapter, url: "https://hwameistor.io/drbd-adapter"}
        - {name: incubator, url: "https://charts.helm.sh/incubator"}
      # kubeone: no formula — pinned-release download script (run_once_23)
    media:
      brews: [ffmpeg, exiftool, ghostscript, gifsicle, mupdf-tools, qpdf, vips]
    playwright:
      # The real set this machine carries. Bootstrap prereqs
      # (build-essential, libffi-dev, python3-dev) belong to bootstrap.sh, not here.
      apt: [fonts-freefont-ttf, fonts-ipafont-gothic, fonts-liberation,
            fonts-noto-color-emoji, fonts-tlwg-loma-otf, fonts-unifont,
            fonts-wqy-zenhei, libasound2t64, libatk-bridge2.0-0t64, libatk1.0-0t64,
            libatspi2.0-0t64, libattr1, libcairo2, libcups2t64, libdbus-1-3,
            libdrm2, libfontconfig1, libfreetype6, libgbm1, libglib2.0-0t64,
            libnspr4, libnss3, libpango-1.0-0, libx11-6, libxcb1, libxcomposite1,
            libxdamage1, libxext6, libxfixes3, libxkbcommon0, libxrandr2, xvfb]
    work:
      # libpq is declared rather than inherited. It arrives anyway as a
      # dependency of composer/php, but 46-libpq.zsh puts its keg on PATH for
      # psql and friends, and depending on another formula's dependency for that
      # is how a `brew autoremove` quietly breaks the Postgres client set.
      brews: [composer, mysql-client, libpq, openblas, azure-cli, caddy, dnsmasq]
    java:
      # maven is inert without a JDK, so it ships with them. zip and unzip are
      # SDKMAN's own hard requirements: its installer aborts on a machine that
      # lacks either, and Ubuntu's base image carries neither. unzip was only
      # ever present by accident, as a transitive dependency of terraform.
      brews: [maven, zip, unzip]
      sdkman: [25-tem, 25-graal]    # SDKMAN owns JDKs; brew casks cannot switch vendors
    go:
      tools:                        # module paths read off both machines' binaries
                                    # (bcrypt-tool is the Mac's; absent here before #30)
        - github.com/onsi/ginkgo/v2/ginkgo@latest
        - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        - golang.org/x/tools/gopls@latest
        - sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
        - github.com/sqlc-dev/sqlc/cmd/sqlc@latest
        - honnef.co/go/tools/cmd/staticcheck@latest
        - github.com/gzuidhof/tygo@latest
        - github.com/shoenig/bcrypt-tool@latest
      brews: [go]
    rust: {}                        # rustup official installer (run_once_31); no cargo-install list
    ai:
      brews: [llama.cpp]
