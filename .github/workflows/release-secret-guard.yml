# Builds cmd/secret-guard for every platform this estate runs on and attaches
# the binaries to a GitHub release, so `chezmoi apply` can fetch one instead of
# needing a Go toolchain on every machine.
#
# Only GitHub's own actions are used. A release asset here becomes an executable
# inside a security hook on every machine in the estate, so the build must not
# depend on a third party's action code.
#
# The acceptance gate for the guard's POLICY is the six shell suites in tests/,
# which need chezmoi, bash and jq and are run before tagging. This workflow runs
# the Go tests only - they carry the 205-case corpus and the mechanism probes,
# and they are what a cross-platform runner can check without reproducing the
# whole estate.
name: release secret-guard

on:
  push:
    tags:
      - "secret-guard-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be aimed at a branch, and github.ref_name would
      # then reach `gh release create` as the tag name - a release tagged
      # `main` is not a release. Dispatch is kept, because it is how a publish
      # that failed after the build is re-run against a tag that already
      # exists. The ref reaches the shell through the environment for the same
      # reason the tag does in the release step.
      - name: refuse a ref that is not a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_TYPE:$REF_NAME" in
            tag:secret-guard-v*) ;;
            *)
              echo "refusing to release from $REF_TYPE '$REF_NAME'; expected a secret-guard-v* tag" >&2
              exit 1
              ;;
          esac

      # Pinned by commit, not by major tag. A tag is mutable, and the output of
      # this job becomes an executable inside a security hook on every machine
      # in the estate - the same argument that keeps third-party actions out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./cmd/secret-guard/

      - name: test
        run: go test ./cmd/secret-guard/ -v

      # CGO off and -trimpath so the binary is static and its paths carry
      # nothing about the machine that built it.
      - name: build every platform
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            GOOS="${target%-*}" GOARCH="${target#*-}" \
              go build -trimpath -ldflags '-s -w' \
                -o "dist/secret-guard-$target" ./cmd/secret-guard
          done
          cd dist
          sha256sum secret-guard-* | tee SHA256SUMS

      # The digests go into home/.chezmoidata/secret-guard.yaml by hand. That is
      # deliberate: pinning is what stops an unverified download from landing in
      # a security hook, and a pin nobody chose is not a pin.
      # The tag name reaches the shell through the environment, never through
      # ${{ }} interpolation into the script body: a tag is attacker-chosen
      # text, and interpolation would splice it into the command line.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # gh infers nothing from the tag's shape, so a candidate would
          # otherwise publish as "Latest" and offer itself to every machine
          # reading the release page. Measured on secret-guard-v0.0.1-rc1,
          # which came out with isPrerelease false.
          flags=()
          case "$TAG" in
            *-rc*|*-alpha*|*-beta*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --title "$TAG" \
            "${flags[@]}" \
            --notes 'Copy the digests from SHA256SUMS into home/.chezmoidata/secret-guard.yaml, then set `version`.' \
            dist/secret-guard-* dist/SHA256SUMS
